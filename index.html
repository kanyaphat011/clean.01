<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ฟอร์มบันทึกการตรวจความสะอาด</title>
  <!-- ดึงฟอนต์ Sarabun และ Prompt ให้ดูสวยนุ่มนวล -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Prompt', 'Sarabun', sans-serif;
    }
    
    body {
      background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%);
      min-height: 100vh;
      margin: 0;
      padding: 30px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      padding: 35px 28px;
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      border: 1px solid #e2e8f0;
    }

    .header-title {
      text-align: center;
      margin-top: 0;
      margin-bottom: 25px;
      color: #0f172a;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      position: relative;
    }

    .header-title::after {
      content: '';
      display: block;
      width: 50px;
      height: 4px;
      background: #22c55e;
      margin: 8px auto 0 auto;
      border-radius: 10px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #334155;
    }

    input[type="text"],
    select {
      width: 100%;
      height: 46px;
      padding: 10px 14px;
      font-size: 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      outline: none;
      background-color: #f8fafc;
      color: #1e293b;
      transition: all 0.2s ease-in-out;
    }

    input[type="text"]:focus,
    select:focus {
      border-color: #22c55e;
      background-color: #ffffff;
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.15);
    }

    input::placeholder {
      color: #94a3b8;
    }

    /* ช่องไฟล์รูปภาพแบบการ์ดน่ารัก */
    .file-input-custom {
      position: relative;
      width: 100%;
      height: 48px;
      border: 1.5px dashed #94a3b8;
      border-radius: 10px;
      background-color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: all 0.2s ease-in-out;
      cursor: pointer;
    }

    .file-input-custom:hover {
      border-color: #22c55e;
      background-color: #f0fdf4;
    }

    input[type="file"] {
      width: 100%;
      height: 100%;
      padding: 8px;
      font-size: 13px;
      color: #475569;
      cursor: pointer;
    }

    /* ปุ่มส่งข้อมูลสีเขียวสดใส */
    .btn-submit {
      width: 100%;
      height: 50px;
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
      transition: all 0.2s ease-in-out;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(34, 197, 94, 0.4);
      background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      background: #cbd5e1;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2 class="header-title">ฟอร์มบันทึกการตรวจความสะอาด</h2>

    <form id="inspectionForm">
      <!-- 1. ชื่อผู้ส่ง -->
      <div class="form-group">
        <label for="sender">ชื่อผู้ส่ง (Sender):</label>
        <input type="text" id="sender" placeholder="ระบุชื่อผู้ส่ง" required>
      </div>

      <!-- 2. สถานที่ / บริเวณ -->
      <div class="form-group">
        <label for="area">สถานที่/บริเวณ (Area):</label>
        <input type="text" id="area" placeholder="เช่น อาคาร 1, สนามฟุตบอล" required>
      </div>

      <!-- 3. ระดับชั้น -->
      <div class="form-group">
        <label for="classVal">ระดับชั้น (Class):</label>
        <select id="classVal" required>
          <option value="">-- เลือกระดับชั้น --</option>
          <option value="ม.1">ม.1</option>
          <option value="ม.2">ม.2</option>
          <option value="ม.3">ม.3</option>
          <option value="ม.4">ม.4</option>
          <option value="ม.5">ม.5</option>
          <option value="ม.6">ม.6</option>
        </select>
      </div>

      <!-- 4. ผู้ตรวจ -->
      <div class="form-group">
        <label for="checker">ผู้ตรวจ (Checker):</label>
        <input type="text" id="checker" placeholder="ระบุชื่อผู้ตรวจ" required>
      </div>

      <!-- 5. ถ่ายภาพ / แนบรูปภาพ -->
      <div class="form-group">
        <label for="imageFile">ถ่ายภาพ / แนบรูปภาพ:</label>
        <div class="file-input-custom">
          <input type="file" id="imageFile" accept="image/*" required>
        </div>
      </div>

      <!-- ปุ่มส่งข้อมูล -->
      <button type="button" class="btn-submit" id="submitBtn" onclick="sendData()">ส่งข้อมูลตรวจความสะอาด</button>
    </form>
  </div>

  <script>
    // 📍 เปลี่ยน URL ตรงนี้เป็น Web App URL ล่าสุดจาก Apps Script (ที่เลือก Everyone)
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxY4vdnTjB9hHFvrc28Rry6NfvLBJex22pR-Ir7psRSZFHhT-22PuSkMMH4YHQVf_4F/exec";

    function getBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    async function sendData() {
      const btn = document.getElementById("submitBtn");
      const sender = document.getElementById("sender").value.trim();
      const area = document.getElementById("area").value.trim();
      const classVal = document.getElementById("classVal").value;
      const checker = document.getElementById("checker").value.trim();
      const fileInput = document.getElementById("imageFile");

      if (!sender || !area || !classVal || !checker || fileInput.files.length === 0) {
        alert("กรุณากรอกข้อมูลให้ครบทุกช่อง และแนบรูปภาพด้วยครับ");
        return;
      }

      btn.disabled = true;
      btn.innerText = "⏳ กำลังส่งข้อมูล...";

      try {
        const imageBase64 = await getBase64(fileInput.files[0]);

        const payload = {
          action: "submit_inspection",
          sender: sender,
          area: area,
          class: classVal,
          checker: checker,
          status: "รอครูตรวจ",
          image: imageBase64
        };

        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        alert("🎉 บันทึกข้อมูลเรียบร้อยแล้ว!");
        document.getElementById("inspectionForm").reset();

      } catch (error) {
        alert("เกิดข้อผิดพลาด: " + error);
      } finally {
        btn.disabled = false;
        btn.innerText = "ส่งข้อมูลตรวจความสะอาด";
      }
    }
  </script>
</body>
</html>
