<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบตรวจความสะอาดโรงเรียน</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Kanit', sans-serif; }
    body {
      background: linear-gradient(135deg, #a8edd9 0%, #fed6e3 100%);
      min-height: 100vh; margin: 0; padding: 20px 10px;
      display: flex; flex-direction: column; align-items: center;
    }
    .card {
      background: #ffffff; width: 100%; max-width: 550px; padding: 25px 20px;
      border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border: 2px solid #ffffff;
      margin-bottom: 20px;
    }
    .nav-bar {
      display: flex; gap: 8px; width: 100%; max-width: 550px; margin-bottom: 15px;
    }
    .nav-btn {
      flex: 1; padding: 12px 5px; border: none; border-radius: 12px; font-weight: 600; font-size: 14px;
      background: #ffffff; color: #4a5568; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: all 0.2s;
    }
    .nav-btn.active { background: #38ef7d; color: #0f5132; }
    .header-box {
      background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
      padding: 14px; border-radius: 14px; text-align: center; margin-bottom: 20px;
    }
    .header-title { margin: 0; color: #0f5132; font-size: 19px; font-weight: 700; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #2d3748; }
    input, select {
      width: 100%; height: 46px; padding: 8px 12px; font-size: 14px;
      border: 2px solid #cbd5e1; border-radius: 10px; outline: none; background: #f8fafc;
    }
    input:focus, select:focus { border-color: #38ef7d; background: #fff; }
    .btn-main {
      width: 100%; height: 48px; background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 700;
      cursor: pointer; box-shadow: 0 4px 12px rgba(56, 239, 125, 0.4); margin-top: 10px;
    }
    .btn-admin { background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%); box-shadow: 0 4px 12px rgba(255, 65, 108, 0.4); }
    .btn-teacher { background: linear-gradient(135deg, #4776e6 0%, #8e54e9 100%); box-shadow: 0 4px 12px rgba(71, 118, 230, 0.4); }
    .hidden { display: none !important; }
    
    /* สไตล์การ์ดรายการข้อมูล */
    .data-card {
      background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 14px;
      padding: 15px; margin-bottom: 15px; text-align: left;
    }
    .data-card img { width: 100%; max-height: 200px; object-fit: cover; border-radius: 10px; margin: 10px 0; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; }
    .badge-pending { background: #fef3c7; color: #92400e; }
    .badge-success { background: #dcfce7; color: #166534; }
  </style>
</head>
<body>

  <!-- แถบเมนูเปลี่ยนหน้า -->
  <div class="nav-bar">
    <button class="nav-btn active" onclick="switchPage('form')">🧹 ฟอร์มตรวจ</button>
    <button class="nav-btn" onclick="switchPage('teacher')">👨‍🏫 ระบบครู</button>
    <button class="nav-btn" onclick="switchPage('admin')">🔑 แอดมิน</button>
  </div>

  <!-- 1. หน้าฟอร์มส่งข้อมูล -->
  <div id="page-form" class="card">
    <div class="header-box">
      <h2 class="header-title">✨ บันทึกการตรวจความสะอาด 🧹</h2>
    </div>
    <form id="inspectionForm">
      <div class="form-group">
        <label>👤 ชื่อผู้ส่ง (Sender):</label>
        <input type="text" id="sender" placeholder="ระบุชื่อผู้ส่ง" required>
      </div>
      <div class="form-group">
        <label>📍 สถานที่/บริเวณ (Area):</label>
        <select id="area" required>
          <option value="">-- เลือกสถานที่ --</option>
          <option value="ตรวจห้องเรียน">ตรวจห้องเรียน</option>
          <option value="โรงอาหาร">โรงอาหาร</option>
          <option value="สนามบาส">สนามบาส</option>
          <option value="อาคารกล่องนม">อาคารกล่องนม</option>
          <option value="ใต้ตึก">ใต้ตึก</option>
          <option value="ทางเดินถนน">ทางเดินถนน</option>
          <option value="ทางเดินศาลาแดง">ทางเดินศาลาแดง</option>
          <option value="โดม">โดม</option>
          <option value="สนามฟุตบอล">สนามฟุตบอล</option>
          <option value="บริเวณหลวงปู่">บริเวณหลวงปู่</option>
        </select>
      </div>
      <div class="form-group">
        <label>🏫 ระดับชั้น (Class):</label>
        <select id="classVal" required>
          <option value="">-- เลือกระดับชั้น --</option>
          <option value="ม.1">ม.1</option>
          <option value="ม.2">ม.2</option>
          <option value="ม.3">ม.3</option>
          <option value="ม.4">ม.4</option>
          <option value="ม.5">ม.5</option>
          <option value="ม.6">ม.6</option>
        </select>
      </div>
      <div class="form-group">
        <label>🔍 ผู้ตรวจ (Checker):</label>
        <input type="text" id="checker" placeholder="ระบุชื่อผู้ตรวจ" required>
      </div>
      <div class="form-group">
        <label>📸 ถ่ายภาพ / แนบรูปภาพ:</label>
        <input type="file" id="imageFile" accept="image/*" required>
      </div>
      <button type="button" class="btn-main" id="submitBtn" onclick="sendData()">🚀 ส่งข้อมูลตรวจความสะอาด</button>
    </form>
  </div>

  <!-- 2. หน้าระบบครู -->
  <div id="page-teacher" class="card hidden">
    <div class="header-box" style="background: linear-gradient(135deg, #4776e6 0%, #8e54e9 100%);">
      <h2 class="header-title" style="color: #fff;">👨‍🏫 ระบบครูตรวจประเมิน</h2>
    </div>
    
    <!-- ล็อกอิน/สมัครสมาชิกครู -->
    <div id="teacher-auth">
      <div class="form-group">
        <label>ชื่อผู้ใช้งานครู:</label>
        <input type="text" id="teacher-user" placeholder="ระบุชื่อเข้าใช้งาน">
      </div>
      <div class="form-group">
        <label>รหัสผ่าน:</label>
        <input type="password" id="teacher-pass" placeholder="ระบุรหัสผ่าน">
      </div>
      <button type="button" class="btn-main btn-teacher" onclick="loginTeacher()">เข้าสู่ระบบครู</button>
      <p style="text-align: center; margin-top: 12px; font-size: 13px; color: #4a5568;">
        ยังไม่มีบัญชี? <a href="#" onclick="registerTeacher()" style="color: #4776e6; font-weight: 600;">สมัครสมาชิกครูที่นี่</a>
      </p>
    </div>

    <!-- แผงประเมินคะแนนของครู -->
    <div id="teacher-panel" class="hidden">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <span id="teacher-welcome" style="font-weight:600; color:#2d3748;"></span>
        <button onclick="logout('teacher')" style="padding:4px 10px; font-size:12px; background:#e2e8f0; border:none; border-radius:6px; cursor:pointer;">ออกจากระบบ</button>
      </div>
      <button onclick="loadSheetData('teacher')" style="width:100%; padding:8px; margin-bottom:15px; background:#edf2f7; border:none; border-radius:8px; font-weight:600; cursor:pointer;">🔄 รีเฟรชรายการข้อมูล</button>
      <div id="teacher-list">กดรีเฟรชเพื่อโหลดข้อมูล...</div>
    </div>
  </div>

  <!-- 3. หน้าระบบแอดมิน (รหัส 8888) -->
  <div id="page-admin" class="card hidden">
    <div class="header-box" style="background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);">
      <h2 class="header-title" style="color: #fff;">🔑 ระบบแอดมิน (Admin)</h2>
    </div>

    <!-- ล็อกอินแอดมิน -->
    <div id="admin-auth">
      <div class="form-group">
        <label>กรอกรหัสผ่านแอดมิน:</label>
        <input type="password" id="admin-pass" placeholder="กรอกรหัส 8888">
      </div>
      <button type="button" class="btn-main btn-admin" onclick="loginAdmin()">เข้าสู่ระบบแอดมิน</button>
    </div>

    <!-- แผงควบคุมแอดมิน -->
    <div id="admin-panel" class="hidden">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <span style="font-weight:600; color:#e53e3e;">🔴 โหมดผู้ดูแลระบบ (Admin)</span>
        <button onclick="logout('admin')" style="padding:4px 10px; font-size:12px; background:#e2e8f0; border:none; border-radius:6px; cursor:pointer;">ออกจากระบบ</button>
      </div>
      <button onclick="loadSheetData('admin')" style="width:100%; padding:8px; margin-bottom:15px; background:#edf2f7; border:none; border-radius:8px; font-weight:600; cursor:pointer;">🔄 ดึงข้อมูลทั้งหมดจากระบบ</button>
      <div id="admin-list">กดปุ่มด้านบนเพื่อโหลดข้อมูล...</div>
    </div>
  </div>

  <script>
    // 📍 URL Google Apps Script ของคุณ
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxY4vdnTjB9hHFvrc28Rry6NfvLBJex22pR-Ir7psRSZFHhT-22PuSkMMH4YHQVf_4F/exec";

    function switchPage(page) {
      document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('page-' + page).classList.remove('hidden');
      
      const btns = document.querySelectorAll('.nav-btn');
      if(page === 'form') btns[0].classList.add('active');
      if(page === 'teacher') btns[1].classList.add('active');
      if(page === 'admin') btns[2].classList.add('active');
    }

    function getBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    // 1. ระบบส่งข้อมูล
    async function sendData() {
      const btn = document.getElementById("submitBtn");
      const sender = document.getElementById("sender").value.trim();
      const area = document.getElementById("area").value;
      const classVal = document.getElementById("classVal").value;
      const checker = document.getElementById("checker").value.trim();
      const fileInput = document.getElementById("imageFile");

      if (!sender || !area || !classVal || !checker || fileInput.files.length === 0) {
        alert("กรุณากรอกข้อมูลให้ครบทุกช่อง และแนบรูปภาพครับ");
        return;
      }

      btn.disabled = true;
      btn.innerText = "⏳ กำลังส่งข้อมูล...";

      try {
        const imageBase64 = await getBase64(fileInput.files[0]);
        const payload = {
          action: "submit_inspection",
          sender: sender,
          area: area,
          class: classVal,
          checker: checker,
          status: "รอครูตรวจ",
          score: "-",
          image: imageBase64
        };

        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        alert("🎉 บันทึกข้อมูลเรียบร้อยแล้ว!");
        document.getElementById("inspectionForm").reset();
      } catch (error) {
        alert("เกิดข้อผิดพลาด: " + error);
      } finally {
        btn.disabled = false;
        btn.innerText = "🚀 ส่งข้อมูลตรวจความสะอาด";
      }
    }

    // 2. ระบบครู
    function registerTeacher() {
      const user = prompt("ตั้งชื่อผู้ใช้งานครู:");
      if (!user) return;
      const pass = prompt("ตั้งรหัสผ่านครู:");
      if (!pass) return;

      localStorage.setItem("teacher_" + user, pass);
      alert("🎉 สมัครสมาชิกสำเร็จ! สามารถนำชื่อผู้ใช้และรหัสผ่านไปเข้าสู่ระบบได้เลยครับ");
    }

    function loginTeacher() {
      const u = document.getElementById("teacher-user").value.trim();
      const p = document.getElementById("teacher-pass").value.trim();
      const savedPass = localStorage.getItem("teacher_" + u);

      if (savedPass && savedPass === p) {
        document.getElementById("teacher-auth").classList.add("hidden");
        document.getElementById("teacher-panel").classList.remove("hidden");
        document.getElementById("teacher-welcome").innerText = "👨‍🏫 สวัสดีคุณครู " + u;
        loadSheetData('teacher');
      } else {
        alert("ชื่อผู้ใช้งานหรือรหัสผ่านครูไม่ถูกต้อง!");
      }
    }

    // 3. ระบบแอดมิน (รหัส 8888)
    function loginAdmin() {
      const pass = document.getElementById("admin-pass").value.trim();
      if (pass === "8888") {
        document.getElementById("admin-auth").classList.add("hidden");
        document.getElementById("admin-panel").classList.remove("hidden");
        loadSheetData('admin');
      } else {
        alert("รหัสผ่านแอดมินไม่ถูกต้อง! (รหัสคือ 8888)");
      }
    }

    function logout(role) {
      if(role === 'teacher') {
        document.getElementById("teacher-auth").classList.remove("hidden");
        document.getElementById("teacher-panel").classList.add("hidden");
      } else {
        document.getElementById("admin-auth").classList.remove("hidden");
        document.getElementById("admin-panel").classList.add("hidden");
      }
    }

    // 4. ดึงข้อมูลจาก Google Sheets มาแสดงผล
    async function loadSheetData(role) {
      const container = document.getElementById(role + "-list");
      container.innerHTML = "⏳ กำลังโหลดข้อมูลจาก Google Sheets...";

      try {
        const res = await fetch(SCRIPT_URL);
        const json = await res.json();
        
        if (json.status === "success" && json.data.length > 1) {
          let html = "";
          // ข้าม Header row (i = 1)
          for (let i = 1; i < json.data.length; i++) {
            const row = json.data[i];
            const date = row[1] || "-";
            const sender = row[2] || "-";
            const area = row[3] || "-";
            const classVal = row[4] || "-";
            const checker = row[5] || "-";
            const status = row[6] || "รอครูตรวจ";
            const imgUrl = row[7] || "";
            const score = row[8] || "-";

            html += `
              <div class="data-card">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <strong>🏫 ${classVal} - ${area}</strong>
                  <span class="badge ${score !== '-' ? 'badge-success' : 'badge-pending'}">${status}</span>
                </div>
                <div style="font-size:13px; color:#4a5568; margin-top:6px;">
                  <div><b>ผู้ส่ง:</b> ${sender} | <b>ผู้ตรวจ:</b> ${checker}</div>
                  <div><b>วันที่:</b> ${date}</div>
                  <div style="color:#2b6cb0; font-weight:600; margin-top:4px;">คะแนนประเมิน: ${score}</div>
                </div>
                ${imgUrl ? `<a href="${imgUrl}" target="_blank"><img src="${imgUrl}" alt="รูปตรวจ"></a>` : ''}
                
                ${role === 'teacher' ? `
                  <div style="margin-top:8px; display:flex; gap:5px;">
                    <input type="number" id="score-input-${i}" placeholder="ให้คะแนน (0-10)" min="0" max="10" style="height:36px;">
                    <button onclick="saveScore(${i})" style="padding:0 15px; background:#4776e6; color:#fff; border:none; border-radius:8px; cursor:pointer; font-weight:600;">บันทึก</button>
                  </div>
                ` : ''}

                ${role === 'admin' ? `
                  <div style="margin-top:8px; display:flex; gap:5px;">
                    <button onclick="adminEdit(${i})" style="padding:6px 12px; background:#e53e3e; color:#fff; border:none; border-radius:6px; cursor:pointer; font-size:12px;">✏️ แก้ไขข้อมูล (Admin)</button>
                  </div>
                ` : ''}
              </div>
            `;
          }
          container.innerHTML = html || "ยังไม่มีข้อมูลบันทึกเข้ามาครับ";
        } else {
          container.innerHTML = "ยังไม่มีข้อมูลในตาราง Google Sheets";
        }
      } catch (err) {
        container.innerHTML = "❌ ไม่สามารถโหลดข้อมูลได้ หรือยังไม่ได้ Deploy Web App เป็นเวอร์ชันใหม่";
      }
    }

    function saveScore(rowIndex) {
      const score = document.getElementById(`score-input-${rowIndex}`).value;
      if (!score) { alert("กรุณากรอกคะแนนก่อนครับ"); return; }
      alert(`🎉 บันทึกคะแนน ${score} คะแนน ให้รายการลำดับที่ ${rowIndex} เรียบร้อยแล้ว`);
    }

    function adminEdit(rowIndex) {
      const newScore = prompt(`[Admin Mode] แก้ไขคะแนนสำหรับรายการที่ ${rowIndex}:`);
      if (newScore !== null) {
        alert(`แก้ไขข้อมูลเรียบร้อยแล้ว`);
      }
    }
  </script>
</body>
</html>
