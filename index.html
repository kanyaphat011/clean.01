<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ฟอร์มบันทึกการตรวจความสะอาด</title>
  <!-- ดึงฟอนต์ Kanit สดใสน่ารัก -->
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Kanit', sans-serif;
    }
    
    /* พื้นหลังสดใสสดชื่น */
    body {
      background: linear-gradient(135deg, #a8edd9 0%, #fed6e3 100%);
      min-height: 100vh;
      margin: 0;
      padding: 30px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* การ์ดสีขาวมุมมน พร้อมเงาสีพาสเทล */
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      padding: 35px 28px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(255, 105, 135, 0.15), 0 5px 15px rgba(0, 0, 0, 0.05);
      border: 3px solid #ffffff;
    }

    /* กล่องหัวข้อสีสันสดใส */
    .header-box {
      background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
      padding: 16px;
      border-radius: 16px;
      text-align: center;
      margin-bottom: 25px;
      box-shadow: 0 6px 15px rgba(56, 249, 215, 0.4);
    }

    .header-title {
      margin: 0;
      color: #0f5132;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-shadow: 1px 1px 2px rgba(255,255,255,0.6);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #2d3748;
    }

    /* ช่องกรอกข้อมูลสีสันนุ่มนวล */
    input[type="text"],
    select {
      width: 100%;
      height: 48px;
      padding: 10px 16px;
      font-size: 15px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      outline: none;
      background-color: #f7fafc;
      color: #2d3748;
      transition: all 0.3s ease;
    }

    input[type="text"]:focus,
    select:focus {
      border-color: #48bb78;
      background-color: #ffffff;
      box-shadow: 0 0 0 4px rgba(72, 187, 120, 0.2);
    }

    input::placeholder {
      color: #a0aec0;
    }

    /* ช่องเลือกไฟล์รูปภาพ */
    .file-box {
      background-color: #fff5f5;
      border: 2px dashed #feb2b2;
      border-radius: 12px;
      padding: 8px 12px;
      transition: all 0.3s ease;
    }

    .file-box:hover {
      background-color: #fff0f0;
      border-color: #fc8181;
    }

    input[type="file"] {
      width: 100%;
      font-size: 14px;
      color: #4a5568;
      cursor: pointer;
    }

    /* ปุ่มส่งข้อมูลสีเขียวสดใสไล่เฉด */
    .btn-submit {
      width: 100%;
      height: 52px;
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 8px 20px rgba(56, 239, 125, 0.4);
      transition: all 0.3s ease;
    }

    .btn-submit:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 25px rgba(56, 239, 125, 0.5);
    }

    .btn-submit:active {
      transform: translateY(-1px);
    }

    .btn-submit:disabled {
      background: #cbd5e0;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- หัวข้อพร้อมแถบสีสดใส -->
    <div class="header-box">
      <h2 class="header-title">✨ ฟอร์มบันทึกการตรวจความสะอาด 🧹</h2>
    </div>

    <form id="inspectionForm">
      <!-- 1. ชื่อผู้ส่ง -->
      <div class="form-group">
        <label for="sender">👤 ชื่อผู้ส่ง (Sender):</label>
        <input type="text" id="sender" placeholder="ระบุชื่อผู้ส่ง" required>
      </div>

      <!-- 2. สถานที่ / บริเวณ -->
      <div class="form-group">
        <label for="area">📍 สถานที่/บริเวณ (Area):</label>
        <input type="text" id="area" placeholder="เช่น อาคาร 1, สนามฟุตบอล" required>
      </div>

      <!-- 3. ระดับชั้น -->
      <div class="form-group">
        <label for="classVal">🏫 ระดับชั้น (Class):</label>
        <select id="classVal" required>
          <option value="">-- เลือกระดับชั้น --</option>
          <option value="ม.1">ม.1</option>
          <option value="ม.2">ม.2</option>
          <option value="ม.3">ม.3</option>
          <option value="ม.4">ม.4</option>
          <option value="ม.5">ม.5</option>
          <option value="ม.6">ม.6</option>
        </select>
      </div>

      <!-- 4. ผู้ตรวจ -->
      <div class="form-group">
        <label for="checker">🔍 ผู้ตรวจ (Checker):</label>
        <input type="text" id="checker" placeholder="ระบุชื่อผู้ตรวจ" required>
      </div>

      <!-- 5. ถ่ายภาพ / แนบรูปภาพ -->
      <div class="form-group">
        <label for="imageFile">📸 ถ่ายภาพ / แนบรูปภาพ:</label>
        <div class="file-box">
          <input type="file" id="imageFile" accept="image/*" required>
        </div>
      </div>

      <!-- ปุ่มส่งข้อมูล -->
      <button type="button" class="btn-submit" id="submitBtn" onclick="sendData()">🚀 ส่งข้อมูลตรวจความสะอาด</button>
    </form>
  </div>

  <script>
    // 📍 เปลี่ยน URL ตรงนี้เป็น Web App URL ล่าสุดจาก Apps Script (ที่เลือก Everyone)
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx.../exec";

    function getBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    async function sendData() {
      const btn = document.getElementById("submitBtn");
      const sender = document.getElementById("sender").value.trim();
      const area = document.getElementById("area").value.trim();
      const classVal = document.getElementById("classVal").value;
      const checker = document.getElementById("checker").value.trim();
      const fileInput = document.getElementById("imageFile");

      if (!sender || !area || !classVal || !checker || fileInput.files.length === 0) {
        alert("กรุณากรอกข้อมูลให้ครบทุกช่อง และแนบรูปภาพด้วยครับ");
        return;
      }

      btn.disabled = true;
      btn.innerText = "⏳ กำลังส่งข้อมูล...";

      try {
        const imageBase64 = await getBase64(fileInput.files[0]);

        const payload = {
          action: "submit_inspection",
          sender: sender,
          area: area,
          class: classVal,
          checker: checker,
          status: "รอครูตรวจ",
          image: imageBase64
        };

        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        alert("🎉 บันทึกข้อมูลเรียบร้อยแล้ว!");
        document.getElementById("inspectionForm").reset();

      } catch (error) {
        alert("เกิดข้อผิดพลาด: " + error);
      } finally {
        btn.disabled = false;
        btn.innerText = "🚀 ส่งข้อมูลตรวจความสะอาด";
      }
    }
  </script>
</body>
</html>
