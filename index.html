<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ฟอร์มบันทึกการตรวจความสะอาด</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body style="background: linear-gradient(135deg, #a8edd9 0%, #fed6e3 100%); min-height: 100vh; margin: 0; padding: 25px 15px; font-family: 'Kanit', sans-serif; display: flex; justify-content: center; align-items: center; box-sizing: border-box;">

  <div style="background: #ffffff; width: 100%; max-width: 480px; padding: 30px 24px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border: 2px solid #ffffff; box-sizing: border-box;">
    
    <!-- แถบหัวข้อสีเขียวมิ้นต์ -->
    <div style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); padding: 15px; border-radius: 14px; text-align: center; margin-bottom: 25px; box-shadow: 0 4px 12px rgba(56,249,215,0.3);">
      <h2 style="margin: 0; color: #0f5132; font-size: 20px; font-weight: 700;">✨ ฟอร์มบันทึกการตรวจความสะอาด 🧹</h2>
    </div>

    <form id="inspectionForm">
      <!-- 1. ชื่อผู้ส่ง -->
      <div style="margin-bottom: 18px;">
        <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #2d3748;">👤 ชื่อผู้ส่ง (Sender):</label>
        <input type="text" id="sender" placeholder="ระบุชื่อผู้ส่ง" required style="width: 100%; height: 46px; padding: 10px 14px; font-size: 14px; border: 2px solid #cbd5e1; border-radius: 10px; outline: none; background-color: #f8fafc; box-sizing: border-box;">
      </div>

      <!-- 2. สถานที่ / บริเวณ -->
      <div style="margin-bottom: 18px;">
        <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #2d3748;">📍 สถานที่/บริเวณ (Area):</label>
        <input type="text" id="area" placeholder="เช่น อาคาร 1, สนามฟุตบอล" required style="width: 100%; height: 46px; padding: 10px 14px; font-size: 14px; border: 2px solid #cbd5e1; border-radius: 10px; outline: none; background-color: #f8fafc; box-sizing: border-box;">
      </div>

      <!-- 3. ระดับชั้น -->
      <div style="margin-bottom: 18px;">
        <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #2d3748;">🏫 ระดับชั้น (Class):</label>
        <select id="classVal" required style="width: 100%; height: 46px; padding: 10px 14px; font-size: 14px; border: 2px solid #cbd5e1; border-radius: 10px; outline: none; background-color: #f8fafc; box-sizing: border-box;">
          <option value="">-- เลือกระดับชั้น --</option>
          <option value="ม.1">ม.1</option>
          <option value="ม.2">ม.2</option>
          <option value="ม.3">ม.3</option>
          <option value="ม.4">ม.4</option>
          <option value="ม.5">ม.5</option>
          <option value="ม.6">ม.6</option>
        </select>
      </div>

      <!-- 4. ผู้ตรวจ -->
      <div style="margin-bottom: 18px;">
        <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #2d3748;">🔍 ผู้ตรวจ (Checker):</label>
        <input type="text" id="checker" placeholder="ระบุชื่อผู้ตรวจ" required style="width: 100%; height: 46px; padding: 10px 14px; font-size: 14px; border: 2px solid #cbd5e1; border-radius: 10px; outline: none; background-color: #f8fafc; box-sizing: border-box;">
      </div>

      <!-- 5. ถ่ายภาพ / แนบรูปภาพ -->
      <div style="margin-bottom: 22px;">
        <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #2d3748;">📸 ถ่ายภาพ / แนบรูปภาพ:</label>
        <div style="background-color: #fff5f5; border: 2px dashed #feb2b2; border-radius: 10px; padding: 6px 10px;">
          <input type="file" id="imageFile" accept="image/*" required style="width: 100%; font-size: 13px; color: #4a5568;">
        </div>
      </div>

      <!-- ปุ่มส่งข้อมูล -->
      <button type="button" id="submitBtn" onclick="sendData()" style="width: 100%; height: 50px; background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: #ffffff; border: none; border-radius: 12px; font-size: 17px; font-weight: 700; cursor: pointer; box-shadow: 0 6px 15px rgba(56, 239, 125, 0.4); font-family: 'Kanit', sans-serif;">🚀 ส่งข้อมูลตรวจความสะอาด</button>
    </form>
  </div>

  <script>
    // 📍 อย่าลืมนำ Web App URL ของคุณมาวางตรงนี้นะครับ
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxY4vdnTjB9hHFvrc28Rry6NfvLBJex22pR-Ir7psRSZFHhT-22PuSkMMH4YHQVf_4F/exec";

    function getBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    async function sendData() {
      const btn = document.getElementById("submitBtn");
      const sender = document.getElementById("sender").value.trim();
      const area = document.getElementById("area").value.trim();
      const classVal = document.getElementById("classVal").value;
      const checker = document.getElementById("checker").value.trim();
      const fileInput = document.getElementById("imageFile");

      if (!sender || !area || !classVal || !checker || fileInput.files.length === 0) {
        alert("กรุณากรอกข้อมูลให้ครบทุกช่อง และแนบรูปภาพด้วยครับ");
        return;
      }

      btn.disabled = true;
      btn.innerText = "⏳ กำลังส่งข้อมูล...";

      try {
        const imageBase64 = await getBase64(fileInput.files[0]);

        const payload = {
          action: "submit_inspection",
          sender: sender,
          area: area,
          class: classVal,
          checker: checker,
          status: "รอครูตรวจ",
          image: imageBase64
        };

        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        alert("🎉 บันทึกข้อมูลเรียบร้อยแล้ว!");
        document.getElementById("inspectionForm").reset();

      } catch (error) {
        alert("เกิดข้อผิดพลาด: " + error);
      } finally {
        btn.disabled = false;
        btn.innerText = "🚀 ส่งข้อมูลตรวจความสะอาด";
      }
    }
  </script>
</body>
</html>
