<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบตรวจความสะอาด</title>
  <style>
    body { font-family: 'Sarabun', sans-serif; padding: 20px; max-width: 500px; margin: auto; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select, button { width: 100%; padding: 10px; box-sizing: border-box; border-radius: 5px; border: 1px solid #ccc; }
    button { background-color: #4CAF50; color: white; border: none; font-size: 16px; cursor: pointer; margin-top: 10px; }
    button:disabled { background-color: #cccccc; }
  </style>
</head>
<body>

  <h2>ฟอร์มบันทึกการตรวจความสะอาด</h2>

  <form id="inspectionForm">
    <!-- 1. ชื่อผู้ส่ง -->
    <div class="form-group">
      <label for="sender">ชื่อผู้ส่ง (Sender):</label>
      <input type="text" id="sender" placeholder="ระบุชื่อผู้ส่ง" required>
    </div>

    <!-- 2. สถานที่ / บริเวณ -->
    <div class="form-group">
      <label for="area">สถานที่/บริเวณ (Area):</label>
      <input type="text" id="area" placeholder="เช่น อาคาร 1, สนามฟุตบอล" required>
    </div>

    <!-- 3. ระดับชั้น (ม.) -->
    <div class="form-group">
      <label for="classVal">ระดับชั้น (Class):</label>
      <select id="classVal" required>
        <option value="">-- เลือกระดับชั้น --</option>
        <option value="ม.1">ม.1</option>
        <option value="ม.2">ม.2</option>
        <option value="ม.3">ม.3</option>
        <option value="ม.4">ม.4</option>
        <option value="ม.5">ม.5</option>
        <option value="ม.6">ม.6</option>
      </select>
    </div>

    <!-- 4. ชื่อผู้ตรวจ -->
    <div class="form-group">
      <label for="checker">ผู้ตรวจ (Checker):</label>
      <input type="text" id="checker" placeholder="ระบุชื่อผู้ตรวจ" required>
    </div>

    <!-- 5. แนบรูปภาพ -->
    <div class="form-group">
      <label for="imageFile">ถ่ายภาพ / แนบรูปภาพ:</label>
      <input type="file" id="imageFile" accept="image/*" required>
    </div>

    <button type="button" id="submitBtn" onclick="sendData()">ส่งข้อมูลตรวจความสะอาด</button>
  </form>

  <script>
    // 📍 1. วาง Web App URL ที่ได้จากการ Deploy สิทธิ์ "Everyone" ตรงนี้
    const SCRIPT_URL = "https://script.google.com/macros/s/XXXXX/exec";

    // ฟังก์ชันแปลงรูปภาพเป็น Base64
    function getBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    // ฟังก์ชันส่งข้อมูลไปยัง Google Apps Script
    async function sendData() {
      const btn = document.getElementById("submitBtn");
      const sender = document.getElementById("sender").value;
      const area = document.getElementById("area").value;
      const classVal = document.getElementById("classVal").value;
      const checker = document.getElementById("checker").value;
      const fileInput = document.getElementById("imageFile");

      if (!sender || !area || !classVal || !checker || fileInput.files.length === 0) {
        alert("กรุณากรอกข้อมูลให้ครบทุกช่อง และแนบรูปภาพครับ");
        return;
      }

      btn.disabled = true;
      btn.innerText = "กำลังส่งข้อมูล...";

      try {
        // แปลงไฟล์รูปภาพเป็น Base64
        const imageBase64 = await getBase64(fileInput.files[0]);

        // จัดก้อนข้อมูลที่จะส่ง
        const payload = {
          action: "submit_inspection",
          sender: sender,
          area: area,
          class: classVal,
          checker: checker,
          status: "รอครูตรวจ",
          image: imageBase64
        };

        // ส่งข้อมูลไปยัง Google Sheets
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors", // ⭐ ใส่เพื่อไม่ให้ติดปัญหาสิทธิ์เมื่อส่งจากอุปกรณ์อื่น
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        alert("บันทึกข้อมูลสำเร็จเรียบร้อยแล้ว!");
        document.getElementById("inspectionForm").reset();

      } catch (error) {
        alert("เกิดข้อผิดพลาดในการส่งข้อมูล: " + error);
      } finally {
        btn.disabled = false;
        btn.innerText = "ส่งข้อมูลตรวจความสะอาด";
      }
    }
  </script>
</body>
</html>
